name: Sync products

on:
  schedule:
    # Minute 17 on purpose: scheduled jobs across all of GitHub pile up at the
    # top of the hour, which is what causes delayed and dropped runs. Hours are
    # listed explicitly so the schedule cannot drift.
    # v3: every hour (was every 4 hours), so stock and sizes are at most ~1 hour old
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # ACTIVE SUPPLIER — the file supplier.txt says which supplier the shop sells:
      #   TS = Thayyil Sports,  MS = MS Retro.
      # Only that supplier is synced; the other one's products are HIDDEN (never
      # deleted — your edited photos stay). To switch back, change the file and
      # run this workflow. Going back takes one run (about 30-40 minutes).
      - name: Which supplier is active
        run: |
          A=$(tr -d " \r\n" < supplier.txt 2>/dev/null | tr a-z A-Z || echo MS)
          [ "$A" = "TS" ] || A=MS
          echo "ACTIVE=$A" >> "$GITHUB_ENV"
          echo "Active supplier: $A"

      # When the supplier changes, hide every product of the other one ONCE
      # (state/active-supplier.txt remembers what was applied).
      - name: Hide the other supplier's products (only after a switch)
        continue-on-error: true
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p state
          LAST=$(cat state/active-supplier.txt 2>/dev/null || echo MS)
          if [ "$LAST" != "$ACTIVE" ]; then
            if [ "$ACTIVE" = "TS" ]; then OTHER="MS-"; else OTHER="TS-"; fi
            echo "Switched $LAST -> $ACTIVE: hiding every $OTHER product (nothing is deleted)"
            python -u visions_sync.py hide-all --prefix "$OTHER" && echo "$ACTIVE" > state/active-supplier.txt
          else
            echo "No switch ($ACTIVE) — nothing to hide"
          fi

      # Thayyil Sports (label TS-). New products are created HIDDEN and wait in
      # the dashboard's Photos -> Review · Thayyil tab; they go live after you
      # approve them. Price = 360 (what Thayyil charges you) + 260 margin = 620.
      - name: Thayyil Sports (new products wait for your approval)
        if: env.ACTIVE == 'TS'
        continue-on-error: true
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: >
          python -u visions_sync.py sync
          --supplier "https://www.thayyilsports.in"
          --collection ""
          --prefix "TS-"
          --review
          --flat-cost 360
          --margin 260
          --max-new 150
          --attribute-name "sizes"
          --skip-sold-out
          --workers 2
          --read-pause 0.15

      # MS Retro. Its products have their own label (MS-), so this step can
      # never touch the Thayyil products above. New products are created
      # HIDDEN and wait in the dashboard's Photos -> Review tab; they only go
      # live after you approve them, with your photos, never MS Retro's.
      # Price = MS Retro's wholesale list price for the jersey type (read from
      # the title: half/five/full sleeve, round/collar neck, sublimation/
      # embroidery) + the 270 margin (--margin 270); their website price is not
      # used. Premium kits (imported / player version / master) = MS Retro's
      # website price + 300, unchanged.
      # At most 150 new products per run (the first import finishes in about
      # 3 runs); stock and sizes of EVERY existing product update every run.
      - name: MS Retro (new products wait for your approval)
        if: env.ACTIVE == 'MS'
        continue-on-error: true
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: >
          python -u visions_sync.py sync
          --supplier "https://msretro.com"
          --collection ""
          --prefix "MS-"
          --review
          --price-table msretro
          --margin 270
          --max-new 150
          --attribute-name "sizes"
          --skip-sold-out
          --workers 2
          --read-pause 0.15

      # Photos, the product list and the Meta catalogue go to Cloudflare Pages
      # (vj-images.pages.dev), right after the stock is updated. Your edited
      # photos (dashboard) always win over the supplier's. The shop, /join and
      # Meta read from Cloudflare, so shoppers don't use up Supabase's quota.
      # Only what changed is uploaded. continue-on-error: a photo hiccup can
      # never block the stock sync or the commit below.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore photos made earlier
        uses: actions/cache/restore@v4
        with:
          path: |
            vj-home/site
            vj-home/last-upload.txt
          key: vj-photos-${{ github.run_id }}
          restore-keys: vj-photos-

      - name: Photos, product list and Meta catalogue to Cloudflare
        continue-on-error: true
        env:
          VJ_HOME: ${{ github.workspace }}/vj-home
          VJ_SUPA: ${{ secrets.SUPABASE_URL }}
          VJ_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          VJ_ACTIVE: ${{ env.ACTIVE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u vj_images.py --ci

      - name: Keep photos for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            vj-home/site
            vj-home/last-upload.txt
          key: vj-photos-${{ github.run_id }}

      - name: Save results
        run: |
          git config user.name  "sync bot"
          git config user.email "actions@github.com"
          git add -A state docs
          git diff --staged --quiet || git commit -m "sync $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
