name: Sync products

on:
  schedule:
    # Minute 17 on purpose: scheduled jobs across all of GitHub pile up at the
    # top of the hour, which is what causes delayed and dropped runs. Hours are
    # listed explicitly so the schedule cannot drift.
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90          # two suppliers now (Thayyil + MS Retro)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Prices, stock and sizes. Also reads the blocklist from Supabase, so a
      # product removed in the app is deleted here and never created again.
      - name: Sync prices and stock
        continue-on-error: true
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          # lets the run report itself to the app, and read the blocklist
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: >
          python -u visions_sync.py sync
          --attribute-name "sizes"
          --skip-sold-out
          --workers 2
          --read-pause 0.15

      # MS Retro. Its products have their own label (MS-), so this step can
      # never touch the Thayyil products above. New products are created
      # HIDDEN and wait in the dashboard's Photos -> Review tab; they only go
      # live after you approve them, with your photos, never MS Retro's.
      # Price = MS Retro's wholesale list price for the jersey type (read from
      # the title: half/five/full sleeve, round/collar neck, sublimation/
      # embroidery) + the 250 margin; their website price is not used.
      # At most 40 new products per run, so the first import spreads over a
      # few runs and never runs out of time.
      - name: MS Retro (new products wait for your approval)
        continue-on-error: true
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: >
          python -u visions_sync.py sync
          --supplier "https://msretro.com"
          --collection ""
          --prefix "MS-"
          --review
          --price-table msretro
          --max-new 40
          --attribute-name "sizes"
          --skip-sold-out
          --workers 2
          --read-pause 0.15

      # Photos for anything the sync just added or changed are copied into the
      # product-images bucket as pre-sized WebP, so the storefront serves them
      # from Supabase's CDN instead of resizing through a proxy on every visit.
      # Finishes in seconds when nothing changed. continue-on-error keeps a
      # photo hiccup from ever blocking the stock sync or the commit below.
      - name: Mirror product photos
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u image_cdn.py

      # Photos, the product list and the Meta catalogue go to Cloudflare Pages
      # (vj-images.pages.dev), right after the stock is updated. Your edited
      # photos (dashboard) always win over the supplier's. The shop, /join and
      # Meta read from Cloudflare, so shoppers don't use up Supabase's quota.
      # Only what changed is uploaded. continue-on-error: a photo hiccup can
      # never block the stock sync or the commit below.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore photos made earlier
        uses: actions/cache/restore@v4
        with:
          path: |
            vj-home/site
            vj-home/last-upload.txt
          key: vj-photos-${{ github.run_id }}
          restore-keys: vj-photos-

      - name: Photos, product list and Meta catalogue to Cloudflare
        continue-on-error: true
        env:
          VJ_HOME: ${{ github.workspace }}/vj-home
          VJ_SUPA: ${{ secrets.SUPABASE_URL }}
          VJ_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u vj_images.py --ci

      - name: Keep photos for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            vj-home/site
            vj-home/last-upload.txt
          key: vj-photos-${{ github.run_id }}

      - name: Save results
        run: |
          git config user.name  "sync bot"
          git config user.email "actions@github.com"
          git add -A state docs
          git diff --staged --quiet || git commit -m "sync $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
