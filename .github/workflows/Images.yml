name: Images (testing)

# Everything to do with branding detection lives here while we get it right.
# Nothing in this file runs on a schedule, so it only ever does something
# when you press Run workflow.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        required: true
        type: choice
        default: score
        options:
          - score        # report which images carry the mark, change nothing
          - restore-all  # put EVERY product back to its original images
          - undo-last    # put back only what the most recent run changed
      limit:
        description: 'Products to check (0 = all)'
        required: false
        default: '0'
      debug:
        description: 'Record what OCR reads on this many images'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: shop
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Install OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr


      - name: Run
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.mode }}" = "score" ]; then
            python -u pipeline.py score \
              --max-products ${{ inputs.limit }} \
              --debug ${{ inputs.debug }}
          else
            python -u pipeline.py "${{ inputs.mode }}"
          fi

      # always commit: score writes docs/report.txt, which is the only
      # reliable way to read a long report if the Actions log drops it
      - name: Save results
        if: always()
        run: |
          git config user.name  "sync bot"
          git config user.email "actions@github.com"
          git add -A state docs
          git diff --staged --quiet || git commit -m "images: ${{ inputs.mode }}"
          git pull --rebase --autostash || true
          git push
