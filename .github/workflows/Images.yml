name: Images (testing)

# Everything to do with branding detection lives here while we get it right.
# Nothing in this file runs on a schedule, so it only ever does something
# when you press Run workflow.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        required: true
        type: choice
        default: score
        options:
          - score        # report a match score for every image, change nothing
          - undo-last    # put back everything the last run changed
      threshold:
        description: 'Only used later, when cleaning by score'
        required: false
        default: '0.30'

permissions:
  contents: write

concurrency:
  group: shop
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Install OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr


      - name: Run
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python pipeline.py "${{ inputs.mode }}"

      # score changes nothing, so there is usually nothing to save
      - name: Save results
        if: ${{ inputs.mode != 'score' }}
        run: |
          git config user.name  "sync bot"
          git config user.email "actions@github.com"
          git add -A state docs
          git diff --staged --quiet || git commit -m "images: ${{ inputs.mode }}"
          git pull --rebase --autostash || true
          git push
