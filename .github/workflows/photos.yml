# Product photos to Cloudflare — v1 (27 Sep 2026)
#
# NEW workflow. It does not change anything in "Sync products" or "Fix a product".
# Every 2 hours it builds the product photos — YOUR EDITED PHOTO (dashboard) wins
# over the supplier's — and uploads only what changed to the free Cloudflare
# Pages site vj-images.pages.dev, where the shop loads its photos from.
# Reads the SAME Supabase secrets the sync already uses; needs two new ones:
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Makes no commits.
name: Product photos to Cloudflare

on:
  schedule:
    - cron: '47 */2 * * *'      # every 2 hours, at minute 47 (the sync runs at minute 17)
  workflow_dispatch: {}          # "Run workflow" button, to run it right now

concurrency:
  group: photos                  # its own group: never waits for, or blocks, the sync
  cancel-in-progress: false

permissions:
  contents: read                 # read-only: this workflow never pushes to the repo

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the photo tool
        run: pip install pillow

      # Photos made on earlier runs are kept between runs, so each run only makes new ones.
      - name: Restore photos made earlier
        uses: actions/cache/restore@v4
        with:
          path: |
            vj-home/site
            vj-home/last-upload.txt
          key: vj-photos-${{ github.run_id }}
          restore-keys: vj-photos-

      - name: Build and upload
        run: python -u vj_images.py --ci
        env:
          VJ_HOME: ${{ github.workspace }}/vj-home
          VJ_SUPA: ${{ secrets.SUPABASE_URL }}
          VJ_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Keep photos for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            vj-home/site
            vj-home/last-upload.txt
          key: vj-photos-${{ github.run_id }}
