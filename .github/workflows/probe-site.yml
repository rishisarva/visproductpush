name: Probe a tracking site

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Tracking page URL (e.g. https://trackcourier.io/india-post-tracking)'
        required: true
        default: 'https://trackcourier.io/india-post-tracking'
      number:
        description: 'One tracking number that has scans'
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u probe_site.py "${{ github.event.inputs.url }}" "${{ github.event.inputs.number }}"
