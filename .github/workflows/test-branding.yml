name: Test branding detection

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Strictness (1.0 default, lower catches more)'
        required: false
        default: '1.0'
      limit:
        description: 'How many products to check'
        required: false
        default: '250'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check detection only
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python pipeline.py auto \
            --max-products ${{ inputs.limit }} \
            --strict ${{ inputs.strict }} \
            --recheck --explain --dry-run
