name: Rebuild storefront SEO

# Runs itself twice a day and after every supplier sync, so new products get
# their pages without you doing anything.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2,14 * * *"     # 08:00 and 20:00 IST
  workflow_run:
    workflows: ["Visions sync"]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - run: pip install requests

      - name: Generate pages
        run: python seo_build.py --src visions-shop-site --out dist --report

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_STOREFRONT_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir dist
