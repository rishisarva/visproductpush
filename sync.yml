name: Sync products

on:
  schedule:
    - cron: '0 */2 * * *'      # every 2 hours, UTC
  workflow_dispatch:            # also lets you run it by hand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          WC_URL: ${{ secrets.WC_URL }}
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
        run: python visions_sync.py sync --attribute-name "sizes" --skip-sold-out
